he_elders", "s2": "it_would_stop_near_the_elders"}, {"h": "वह कहता था नमस्ते मैं सुन रहा हूँ", "e": "It would say hello I am listening", "s": "it_would_say_hello_i_am_listening", "s2": "it_would_say_hello_i_am_listening"}, {"h": "लोग उसे अपनी कहानियाँ सुनाते थे", "e": "People told it their stories", "s": "people_told_it_their_stories", "s2": "people_told_it_their_stories"}, {"h": "वह गीत और लोरियाँ रिकॉर्ड करता था", "e": "It recorded songs and lullabies", "s": "it_recorded_songs_and_lullabies", "s2": "it_recorded_songs_and_lullabies"}, {"h": "जब कोई थक जाता तो वह कहता", "e": "When someone got tired it would say", "s": "when_someone_got_tired_it_would_say", "s2": "when_someone_got_tired_it_would_say"}, {"h": "आइए थोड़ा आराम करें", "e": "Let us rest a while", "s": "let_us_rest_a_while", "s2": "let_us_rest_a_while"}, {"h": "धीरे धीरे उसने सैकड़ों आवाज़ें इकट्ठी कीं", "e": "Slowly it collected hundreds of voices", "s": "slowly_it_collected_hundreds_of_voices", "s2": "slowly_it_collected_hundreds_of_voices"}, {"h": "हर आवाज़ एक खज़ाना थी", "e": "Every voice was a treasure", "s": "every_voice_was_a_treasure", "s2": "every_voice_was_a_treasure"}, {"h": "बच्चों ने उन आवाज़ों से अपनी भाषा सीखी", "e": "The children learned their language from those voices", "s": "the_children_learned_their_language_from_those_voices", "s2": "the_children_learned_their_language_from_those_voices"}, {"h": "इस तरह भाषा सेतु ने अतीत और भविष्य को जोड़ा", "e": "In this way BhashaSetu connected the past and the future", "s": "in_this_way_bhashasetu_connected_the_past_and_the_future", "s2": "in_this_way_bhashasetu_connected_the_past_and_the_future"}]}];

let lang = 'hi';
let mode = 'single';
let queue = [];
const player = document.getElementById('player');
const nowPlaying = document.getElementById('nowplaying');

/* Build a list of candidate file paths, tried in order until one loads. */
function candidates(it) {
  if (lang === 'hi') {
    const u = it.h.split(' ').join('_');
    return ['audio/hindi_' + u + '.mp3', 'audio/hindi_' + it.h + '.mp3'];
  }
  const list = ['audio/' + it.s + '.mp3'];
  if (it.s2 && it.s2 !== it.s) list.push('audio/' + it.s2 + '.mp3');
  return list;
}

let tryList = [];
function loadAndPlay(it) {
  tryList = candidates(it);
  attempt();
}
function attempt() {
  if (!tryList.length) { onFail(); return; }
  player.src = tryList.shift();
  player.play().catch(function () { attempt(); });
}
player.addEventListener('error', function () { attempt(); });

function onFail() {
  nowPlaying.textContent = 'Audio file not found for this phrase.';
  if (mode === 'story') advanceStory();
}

function clearPlaying() {
  const els = document.querySelectorAll('.playing');
  for (let i = 0; i < els.length; i++) els[i].classList.remove('playing');
}

player.addEventListener('ended', function () {
  if (mode === 'story') { advanceStory(); }
  else { clearPlaying(); nowPlaying.textContent = ''; }
});

function playSingle(it, el) {
  mode = 'single';
  queue = [];
  clearPlaying();
  if (el) el.classList.add('playing');
  nowPlaying.textContent = (lang === 'hi' ? it.h : it.e);
  loadAndPlay(it);
}

function playStory(si) {
  mode = 'story';
  queue = STORIES[si].lines.map(function (ln, li) {
    return { it: ln, id: 'st' + si + 'ln' + li };
  });
  advanceStory();
}

function advanceStory() {
  if (mode !== 'story' || !queue.length) {
    mode = 'single'; clearPlaying(); nowPlaying.textContent = ''; return;
  }
  const step = queue.shift();
  clearPlaying();
  const el = document.getElementById(step.id);
  if (el) { el.classList.add('playing'); el.scrollIntoView({block: 'center', behavior: 'smooth'}); }
  nowPlaying.textContent = (lang === 'hi' ? step.it.h : step.it.e);
  loadAndPlay(step.it);
}

function stopStory() {
  mode = 'single'; queue = []; player.pause();
  clearPlaying(); nowPlaying.textContent = '';
}

function playLine(si, li) {
  playSingle(STORIES[si].lines[li], document.getElementById('st' + si + 'ln' + li));
}

function setLang(l) {
  lang = l; stopStory();
  document.getElementById('btn-hi').classList.toggle('on', l === 'hi');
  document.getElementById('btn-en').classList.toggle('on', l === 'en');
  render(); renderStories();
}

function setTab(t) {
  stopStory();
  document.getElementById('tab-p').classList.toggle('on', t === 'p');
  document.getElementById('tab-s').classList.toggle('on', t === 's');
  document.getElementById('view-p').classList.toggle('hidden', t !== 'p');
  document.getElementById('view-s').classList.toggle('hidden', t !== 's');
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const c = document.getElementById('cat').value;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let n = 0;
  PHRASES.forEach(function (p) {
    if (c && p.c !== c) return;
    if (q && p.h.toLowerCase().indexOf(q) === -1 && p.e.toLowerCase().indexOf(q) === -1) return;
    n++;
    const b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML = '<div class="cat">' + p.c + '</div>' +
                  '<div class="hindi">' + (lang === 'hi' ? p.h : p.e) + '</div>' +
                  '<div class="english">' + (lang === 'hi' ? p.e : p.h) + '</div>';
    b.onclick = function () { playSingle(p, b); };
    grid.appendChild(b);
  });
  document.getElementById('count').textContent = n + ' / ' + PHRASES.length;
}

function renderStories() {
  const w = document.getElementById('view-s');
  w.innerHTML = '';
  STORIES.forEach(function (st, si) {
    const d = document.createElement('div');
    d.className = 'story';
    let s = '<h3>' + (lang === 'hi' ? st.th : st.te) + '</h3>' +
            '<div class="sub">' + (lang === 'hi' ? st.te : st.th) + '</div>' +
            '<button class="play-story" onclick="playStory(' + si + ')">&#9654; ' +
            (lang === 'hi' ? 'पूरी कहानी सुनें' : 'Play full story') + '</button>' +
            '<button class="stop-story" onclick="stopStory()">&#9632; ' +
            (lang === 'hi' ? 'रोकें' : 'Stop') + '</button><div style="margin-top:12px">';
    st.lines.forEach(function (ln, li) {
      s += '<button class="line" id="st' + si + 'ln' + li + '" onclick="playLine(' + si + ',' + li + ')">' +
           '<div class="hindi">' + (lang === 'hi' ? ln.h : ln.e) + '</div>' +
           '<div class="english">' + (lang === 'hi' ? ln.e : ln.h) + '</div></button>';
    });
    d.innerHTML = s + '</div>';
    w.appendChild(d);
  });
}

(function init() {
  const cats = [];
  PHRASES.forEach(function (p) { if (cats.indexOf(p.c) === -1) cats.push(p.c); });
  const sel = document.getElementById('cat');
  cats.forEach(function (c) {
    const o = document.createElement('option');
    o.value = c; o.textContent = c; sel.appendChild(o);
  });
  document.getElementById('search').addEventListener('input', render);
  sel.addEventListener('change', render);
  render(); renderStories();
})();
</script>
