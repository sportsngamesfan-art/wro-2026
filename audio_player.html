let lang = 'hi';
const player = document.getElementById('player');
const nowPlaying = document.getElementById('nowplaying');

function candidates(p) {
  if (lang === 'hi') return ['audio/hindi_' + p.h.split(' ').join('_') + '.mp3'];
  if (lang === 'sa') return ['audio/sanskrit_' + p.s + '.mp3', 'audio/hindi_' + p.h.split(' ').join('_') + '.mp3'];
  if (lang === 'ta') return ['audio/tamil_' + p.s + '.mp3'];
  if (lang === 'od') return ['audio/odia_' + p.s + '.wav'];
  return ['audio/' + p.s + '.mp3'];
}
function textFor(p) {
  if (lang === 'hi') return p.h;
  if (lang === 'sa') return p.sa;
  if (lang === 'ta') return p.ta;
  if (lang === 'od') return p.od;
  return p.e;
}
function subFor(p) { return lang === 'en' ? p.h : p.e; }

let tryQueue = [];
function playPhrase(p, el) {
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  if (el) el.classList.add('playing');
  nowPlaying.textContent = textFor(p);
  tryQueue = candidates(p);
  attemptPlay();
}
function attemptPlay() {
  if (!tryQueue.length) { nowPlaying.textContent += '  (audio not found)'; return; }
  player.src = tryQueue.shift();
  player.play().catch(attemptPlay);
}
player.addEventListener('error', attemptPlay);

function setLang(l) {
  lang = l;
  ['hi','en','sa','ta','od'].forEach(x => document.getElementById('btn-'+x).classList.toggle('on', l===x));
  render();
}
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let shown = 0;
  PHRASES.forEach(p => {
    if (q && p.h.toLowerCase().indexOf(q)===-1 && p.e.toLowerCase().indexOf(q)===-1 &&
        p.sa.toLowerCase().indexOf(q)===-1 && p.ta.toLowerCase().indexOf(q)===-1 &&
        p.od.toLowerCase().indexOf(q)===-1) return;
    shown++;
    const b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML = '<div class="primary">'+textFor(p)+'</div><div class="secondary">'+subFor(p)+'</div>';
    b.onclick = () => playPhrase(p, b);
    grid.appendChild(b);
  });
  document.getElementById('count').textContent = shown + ' / ' + PHRASES.length;
}
document.getElementById('search').addEventListener('input', render);
render();
