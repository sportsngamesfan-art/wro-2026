function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  phrases.forEach(p => {
    if (q && !(p.h.toLowerCase().includes(q) || p.e.toLowerCase().includes(q))) return;
    const btn = document.createElement('button');
    btn.className = 'btn';
    const primary = lang === 'hi' ? p.h : p.e;
    const secondary = lang === 'hi' ? p.e : p.h;
    btn.innerHTML = '<div class="hindi">' + primary + '</div><div class="english">' + secondary + '</div>';
    btn.onclick = () => {
      const file = lang === 'hi' ? 'audio/hindi_' + p.h.replace(/ /g, '_') + '.mp3' : 'audio/' + p.s + '.mp3';
      document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
      btn.classList.add('playing');
      document.getElementById('player').src = file;
      document.getElementById('player').play();
    };
    grid.appendChild(btn);
  });
}

function filter() { render(); }

render();
</script>

<script>
const storyLines = [
  {h: "एक बार की बात है", e: "Once upon a time"},
  {h: "एक बुज़ुर्ग महिला रहती थी", e: "An elderly woman lived"},
  {h: "उसकी कहानियाँ बहुत सुंदर थीं", e: "Her stories were beautiful"},
  {h: "लेकिन कोई सुनने वाला नहीं था", e: "But no one listened"},
  {h: "एक दिन एक रोबोट आया", e: "One day a robot came"},
  {h: "रोबोट का नाम भाषा सेतु था", e: "Its name was BhashaSetu"},
  {h: "अब उसकी कहानियाँ हमेशा जीवित रहेंगी", e: "Now her stories live forever"}
];

let storyIdx = 0;

function playFullStory() {
  storyIdx = 0;
  playNextStoryLine();
}

function playNextStoryLine() {
  if (storyIdx >= storyLines.length) return;
  const line = storyLines[storyIdx];
  const file = lang === 'hi' 
    ? 'audio/hindi_' + line.h.replace(/ /g, '_') + '.mp3'
    : 'audio/' + line.e.toLowerCase().replace(/ /g, '_') + '.mp3';
  document.getElementById('player').src = file;
  document.getElementById('player').play();
  storyIdx++;
}

document.getElementById('player').addEventListener('ended', playNextStoryLine);
</script></body></html>
